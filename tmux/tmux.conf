# ----	tmux-sensible	----

# Address vim mode switching delay (https://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 default
set -g history-limit 50000

# Number windows and panes from 1, so the first window is prefix + 1
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Pass focus events to programs (Vim autoread, editors that save on blur)
set -s focus-events on

# Upgrade $TERM
set -g default-terminal "screen-256color"

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Disable `tmux` automatic renaming of session windows
set-option -g allow-rename off
set-option -g automatic-rename off

# ----	Custom Keymaps	----

bind C-p previous-window
bind C-n next-window
bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.tmux.conf reloaded"

# Claude attention: jump to the oldest session needing input (repeat to cycle), or pick from a menu
bind a run-shell -b "~/.config/tmux/scripts/claude-attention.sh jump"
bind A run-shell -b "~/.config/tmux/scripts/claude-attention.sh menu"

bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Pass modified keys, like "Shift+Enter" to programs inside tmux
set -s extended-keys on
# Tell tmux the outer terminal can send extended keys
set -as terminal-features 'xterm*:extkeys'
# tmux 3.5+: send them in CSI-u format (\e[13;2u), which Claude Code understands
set -s extended-keys-format csi-u

# ----	Panes & Windows	----

# Ensure splits & new windows maintain the path they were split from
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move the current window left/right (Option+< / Option+>) and keep it selected
bind -n M-< swap-window -t -1 \; select-window -t -1
bind -n M-> swap-window -t +1 \; select-window -t +1

# Looking at a pane acknowledges a finished Claude turn; "waiting"/"error" stay until answered
set-hook -g pane-focus-in 'if -F "#{==:#{@claude_state},done}" "set -pu @claude_state ; set -pu @claude_since"'
set-hook -g session-window-changed 'if -F "#{==:#{@claude_state},done}" "set -pu @claude_state ; set -pu @claude_since"'

# Heavy border lines
setw -g pane-border-lines heavy

# ----	Colors & Terminal	----

# 24-bit true color when the outer terminal's TERM is xterm-256color (3.6+ also detects COLORTERM=truecolor)
set -as terminal-features ",xterm-256color:RGB"

# Clipboard via OSC 52 on both macOS and Linux, locally or over SSH: copy-mode yanks and apps
# inside tmux (Nvim) reach the outer terminal's clipboard without pbcopy/xclip on this host.
# iTerm2 needs Settings > General > Selection > "Applications in terminal may access clipboard".
set -s set-clipboard on

# ----	Status Bar	----
# dotbar-style layout, colours follow the iTerm profile
# Style adopted from: https://github.com/vaaleyard/tmux-dotbar (options set inline, no plugin)
# Colours are ANSI names, so iTerm renders them with the active profile palette
set -g status on
set -g status-position bottom
set -g status-interval 5
# fg=terminal = iTerm profile foreground, so uncoloured status text (separators, inactive windows) stays readable on any theme
set -g status-style "bg=default,fg=terminal"

# Left: windows only (status-left empty so the list starts at the edge)
set -g status-left ""
set -g status-left-length 0
set -g window-status-separator "·"
set -g window-status-current-style default
# One icon per pane whose Claude session needs attention (state set by scripts/claude-attention.sh)
set -g @claude_icons "#{P:#{?#{==:#{@claude_state},waiting},#[fg=red] ●,#{?#{==:#{@claude_state},error},#[fg=red] ✕,#{?#{==:#{@claude_state},done},#[fg=yellow] ●,}}}}"
set -g window-status-format " #W#{E:@claude_icons} "
set -g window-status-current-format "#[fg=yellow,bold] #W#{?window_zoomed_flag, (z),}#{E:@claude_icons} "
set -g window-status-bell-style "fg=red,bold"
set -g window-status-activity-style "fg=white"

# Right path · git · claude usage · date (date turns red while prefix is held)
# git-status.sh prints its own leading "· " so non-repo panes don't get a double dot
set -g status-right-length 140
set -g status-right "#[fg=white]#(~/.config/tmux/scripts/path.sh '#{pane_current_path}') #(~/.config/tmux/scripts/git.sh '#{pane_current_path}')#(~/.config/tmux/scripts/claude-attention.sh count) #[fg=white]· #[fg=white]#(~/.config/tmux/scripts/claude.sh) #[fg=white]· #(~/.config/tmux/scripts/battery.sh) #[fg=terminal]· #{?client_prefix,#[fg=red bold],#[fg=brightblue]}%Y-%m-%d %H:%M #[default]"
